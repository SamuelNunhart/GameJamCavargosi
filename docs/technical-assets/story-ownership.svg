<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#375868" stroke-width="1.5"/></marker></defs><rect width="1000" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#162b35"><text x="500" y="30" text-anchor="middle" font-size="26">Od vlastníka interakcie k progresu</text><rect x="260" y="55" width="480" height="96" rx="8" fill="#edf3f5" stroke="#748e99"/><text x="500.0" y="90" text-anchor="middle" font-size="22">Aktívny komponent + StoryAccess.Allows</text><text x="500.0" y="117" text-anchor="middle" font-size="22">owner = All alebo owner = Current</text><rect x="55" y="208" width="390" height="96" rx="8" fill="#edf3f5" stroke="#748e99"/><text x="250.0" y="243" text-anchor="middle" font-size="22">Rig v rovnakej scéne</text><text x="250.0" y="270" text-anchor="middle" font-size="22">Current = rig.Story</text><rect x="555" y="208" width="390" height="96" rx="8" fill="#edf3f5" stroke="#748e99"/><text x="750.0" y="243" text-anchor="middle" font-size="22">Bez takého rigu</text><text x="750.0" y="270" text-anchor="middle" font-size="22">Current = Arthur</text><path d="M370 151 L250 203" fill="none" stroke="#375868" stroke-width="2.3" marker-end="url(#a)"/><path d="M630 151 L750 203" fill="none" stroke="#375868" stroke-width="2.3" marker-end="url(#a)"/><path d="M250 304 L250 340 L500 340 L500 370" fill="none" stroke="#375868" stroke-width="2.3" marker-end="url(#a)"/><path d="M750 304 L750 340 L500 340" fill="none" stroke="#375868" stroke-width="2.3" marker-end="url(#a)"/><rect x="210" y="375" width="580" height="96" rx="8" fill="#edf3f5" stroke="#748e99"/><text x="500.0" y="410" text-anchor="middle" font-size="22">Zhoda + miestne podmienky interakcie</text><text x="500.0" y="437" text-anchor="middle" font-size="22">dosah / trigger / gate / voľné ovládanie</text><path d="M500 471 L500 515" fill="none" stroke="#375868" stroke-width="2.3" marker-end="url(#a)"/><rect x="210" y="520" width="580" height="96" rx="8" fill="#edf3f5" stroke="#748e99"/><text x="500.0" y="555" text-anchor="middle" font-size="22">StartDialogue(data, lock, callback)</text><text x="500.0" y="582" text-anchor="middle" font-size="22">odmietne prázdny alebo súbežný dialóg</text><path d="M500 616 L500 660" fill="none" stroke="#375868" stroke-width="2.3" marker-end="url(#a)"/><rect x="210" y="665" width="580" height="96" rx="8" fill="#edf3f5" stroke="#748e99"/><text x="500.0" y="700" text-anchor="middle" font-size="22">Dokončenie → callback / udalosť</text><text x="500.0" y="727" text-anchor="middle" font-size="22">controller môže povoliť ďalší krok</text><text x="500" y="805" text-anchor="middle" font-size="19">Bez zhody sa príbehová interakcia nespustí. Filter sám neurčuje poradie úloh.</text></g></svg>